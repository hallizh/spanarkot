name: API check

on:
  push:
    branches: [claude/torrevieja-trip-planner-tj2mk6]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch forecast
        run: |
          code=$(curl -sS -o forecast.json -w "%{http_code}" "https://api.open-meteo.com/v1/forecast?latitude=37.92&longitude=-0.75&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max,precipitation_probability_max,wind_speed_10m_max&timezone=Europe%2FMadrid&forecast_days=16")
          echo "FORECAST_HTTP=$code"
          echo "----FORECAST_JSON_START----"
          cat forecast.json
          echo ""
          echo "----FORECAST_JSON_END----"
      - name: Fetch marine
        run: |
          code=$(curl -sS -o marine.json -w "%{http_code}" "https://marine-api.open-meteo.com/v1/marine?latitude=37.9&longitude=-0.6&hourly=sea_surface_temperature,wave_height&timezone=Europe%2FMadrid&forecast_days=10")
          echo "MARINE_HTTP=$code"
          echo "----MARINE_JSON_START----"
          cat marine.json
          echo ""
          echo "----MARINE_JSON_END----"
      - name: Upload responses
        uses: actions/upload-artifact@v4
        with:
          name: api-data
          path: |
            forecast.json
            marine.json
